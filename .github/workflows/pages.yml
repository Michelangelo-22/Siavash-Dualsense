name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The Cloudflare Pages mirror is optional: it stays off until the API token and account id are
    # added as repository secrets, so the GitHub Pages deploy keeps working on its own.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'siavash-dualsense' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring

      - name: Render both language pages
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # Serving on your own domain is one setting away: put the bare host (no scheme, no slash)
          # in the repository variable CUSTOM_DOMAIN under Settings -> Secrets and variables ->
          # Actions -> Variables. The share URLs then use that host and a CNAME file is published,
          # which is what GitHub Pages (and a Cloudflare proxy in front of it) needs. Leave the
          # variable empty and the build stays on the github.io address exactly as before.
          DOMAIN="${{ vars.CUSTOM_DOMAIN }}"
          if [ -n "$DOMAIN" ]; then
            HOST="$DOMAIN"
            BASE=""
          else
            HOST="$OWNER.github.io"
            if [ "$REPO" = "$OWNER.github.io" ]; then
              BASE=""
            else
              BASE="/$REPO"
            fi
          fi
          mkdir -p dist
          DS_PAGES_HOST="$HOST" DS_PAGES_PATH="$BASE" \
            php tools/build-static.php en dist/index.html
          DS_PAGES_HOST="$HOST" DS_PAGES_PATH="$BASE" \
            php tools/build-static.php fa dist/fa.html
          if [ -n "$DOMAIN" ]; then
            printf '%s\n' "$DOMAIN" > dist/CNAME
          fi

      - name: Copy static assets
        run: |
          set -euo pipefail
          cp -R assets dist/assets
          touch dist/.nojekyll
          du -sh dist

      # Cloudflare Pages serves the site from the root of its own free *.pages.dev address and is
      # cached much longer than GitHub Pages allows, so it gets its own render (absolute share URLs
      # for that host) plus a _headers file. Skipped entirely while the secrets are missing.
      - name: Render the Cloudflare Pages copy
        if: env.CF_TOKEN != ''
        run: |
          set -euo pipefail
          mkdir -p dist-cf
          DS_PAGES_HOST="$CF_PROJECT.pages.dev" DS_PAGES_PATH="" \
            php tools/build-static.php en dist-cf/index.html
          DS_PAGES_HOST="$CF_PROJECT.pages.dev" DS_PAGES_PATH="" \
            php tools/build-static.php fa dist-cf/fa.html
          cp -R assets dist-cf/assets
          touch dist-cf/.nojekyll
          # Asset URLs already carry ?v=<mtime>, so a year of caching is safe; the font is the one
          # reference without a stamp, so it revalidates weekly instead.
          cat > dist-cf/_headers <<'HEADERS'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /assets/fonts/*
            Cache-Control: public, max-age=604800
          /*.html
            Cache-Control: public, max-age=0, must-revalidate
          HEADERS
          du -sh dist-cf

      - name: Publish to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-cf --project-name=${{ env.CF_PROJECT }} --branch=main

      # Verifies the Pages configuration and exposes base_path; the site itself is enabled once
      # in Settings -> Pages with Source = "GitHub Actions".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
