name: Delete the old Pages project

# One-off: removes the retired siavash-dualsense project, then removes itself.
on:
  push:
    paths:
      - .github/workflows/cleanup-old-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OLD: siavash-dualsense
    steps:
      - name: Delete the old project
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$OLD"
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X DELETE "$url" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "delete status: $code"
          head -c 200 /tmp/out.json || true
          echo
          probe=$(curl -sS -o /dev/null -w '%{http_code}' "$url" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "lookup after delete: $probe"
          test "$probe" = "404"

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove this workflow
        run: |
          set -euo pipefail
          git rm -q .github/workflows/cleanup-old-pages.yml
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "Remove the one-off Pages cleanup workflow"
          git push
